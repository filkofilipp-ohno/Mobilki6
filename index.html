<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Библиотека — Вход</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <main class="app-main">

      <section class="hero">
        <div class="hero__icon">📚</div>
        <h1 class="hero__title">Библиотека</h1>
        <p class="hero__subtitle">Твой личный читательский дневник</p>
      </section>

      <nav class="tabs">
        <div class="tabs__item active">Вход</div>
        <div class="tabs__item">Регистрация</div>
      </nav>

      <form class="app-main" style="padding: 0;">
        <div class="field">
          <label for="email">Электронная почта</label>
          <input id="email" type="email" placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" placeholder="••••••••">
          <span class="error">Неверный пароль. Попробуйте ещё раз.</span>
        </div>

        <button class="btn btn--primary" type="submit">Войти в кабинет</button>
        <button class="btn btn--outline" type="button">Войти через Google</button>
      </form>

    </main>

    <footer class="app-nav">
      <a class="app-nav__item active" href="catalog.html"><span class="icon">📖</span>Каталог</a>
      <a class="app-nav__item"><span class="icon">🔍</span>Поиск</a>
      <a class="app-nav__item"><span class="icon">➕</span>Добавить</a>
      <a class="app-nav__item" href="index.html"><span class="icon">👤</span>Профиль</a>
    </footer>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
